<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Прогнози 2026</title>
    <style>
        :root {
            --primary-bg: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #e10600; /* F1 Red */
            --text-color: #ffffff;
            --gold: #ffd700;
            --gray-text: #b3b3b3;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--accent-color);
            width: 100%;
            max-width: 900px;
        }

        .nav-buttons {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 25px;
            cursor: pointer;
            background: var(--card-bg);
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover, button.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .controls {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        select {
            padding: 12px;
            border-radius: 8px;
            background: #2d2d2d;
            color: white;
            border: 1px solid var(--accent-color);
            font-size: 1rem;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px 10px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            color: var(--accent-color);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .total-col {
            font-weight: bold;
            color: var(--gold);
            text-align: right;
        }

        .points-val {
            text-align: right;
        }

        .hidden { display: none; }

        .race-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }

        .flag-img {
            width: 50px;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        tr:last-child td { border: none; }

        @media (max-width: 600px) {
            th, td { padding: 10px 5px; font-size: 0.85rem; }
            .flag-img { width: 35px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🏁 F1 ШАМПИОНАТ 2026</h1>
    </header>

    <div class="nav-buttons">
        <button onclick="showTab('general')" id="btn-general" class="active">Генерално</button>
        <button onclick="showTab('races')" id="btn-races">По състезания</button>
    </div>

    <div id="general-tab" class="container">
        <h2>🏆 Общо класиране</h2>
        <table>
            <thead>
                <tr>
                    <th style="width: 50px;">Поз.</th>
                    <th>Участник</th>
                    <th style="text-align: right;">Точки</th>
                </tr>
            </thead>
            <tbody id="general-body"></tbody>
        </table>
    </div>

    <div id="races-tab" class="container hidden">
        <div class="controls">
            <label for="race-select">Избери състезание от календара:</label>
            <select id="race-select" onchange="renderRaceResults()">
                </select>
        </div>

        <div class="race-header" id="race-header-info">
            <img src="" id="current-flag" class="flag-img" alt="Flag">
            <h2 id="current-race-title" style="margin:0;">Гран При</h2>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Участник</th>
                    <th class="points-val">Предварителна</th>
                    <th class="points-val">След Квалиф.</th>
                    <th class="total-col">ОБЩО</th>
                </tr>
            </thead>
            <tbody id="race-results-body"></tbody>
        </table>
    </div>

    <script>
        // Данни от твоя файл (База: Австралия)
        const participants = ["Славчо", "Георги", "Радослав", "Александър", "Димитър", "Ангел"];
        
        const raceData = {
            "Австралия": { 
                "Славчо": [32, 12], "Георги": [20, 19], "Радослав": [12, 25], 
                "Александър": [19, 15], "Димитър": [17, 16], "Ангел": [0, 0] 
            }
        };

        // Официален календар за 2026
        const f1Calendar2026 = [
            { id: "au", name: "Австралия" },
            { id: "cn", name: "Китай" },
            { id: "jp", name: "Япония" },
            { id: "bh", name: "Бахрейн" },
            { id: "sa", name: "Саудитска Арабия" },
            { id: "us", name: "Маями" },
            { id: "ca", name: "Канада" },
            { id: "mc", name: "Монако" },
            { id: "es", name: "Барселона" },
            { id: "at", name: "Австрия" },
            { id: "gb", name: "Великобритания" },
            { id: "be", name: "Белгия" },
            { id: "hu", name: "Унгария" },
            { id: "nl", name: "Нидерландия" },
            { id: "it", name: "Италия" },
            { id: "es", name: "Мадрид" },
            { id: "az", name: "Азербайджан" },
            { id: "sg", name: "Сингапур" },
            { id: "us", name: "САЩ (Остин)" },
            { id: "mx", name: "Мексико" },
            { id: "br", name: "Бразилия" },
            { id: "us", name: "Лас Вегас" },
            { id: "qa", name: "Катар" },
            { id: "ae", name: "Абу Даби" }
        ];

        function init() {
            const select = document.getElementById('race-select');
            f1Calendar2026.forEach(race => {
                let option = document.createElement('option');
                option.value = race.name;
                option.setAttribute('data-flag', race.id);
                option.text = "ГП на " + race.name;
                select.appendChild(option);
            });

            renderGeneralStandings();
            renderRaceResults();
        }

        function renderGeneralStandings() {
            let totals = {};
            participants.forEach(p => totals[p] = 0);

            Object.values(raceData).forEach(race => {
                participants.forEach(p => {
                    totals[p] += (race[p][0] + race[p][1]);
                });
            });

            const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
            const body = document.getElementById('general-body');
            body.innerHTML = "";

            sorted.forEach((item, index) => {
                body.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item[0]} ${index === 0 ? '👑' : ''}</td>
                        <td class="points-val total-col">${item[1]}</td>
                    </tr>
                `;
            });
        }

        function renderRaceResults() {
            const select = document.getElementById('race-select');
            const selectedRace = select.value;
            const flagCode = select.options[select.selectedIndex].getAttribute('data-flag');
            
            document.getElementById('current-race-title').innerText = "Гран При на " + selectedRace;
            document.getElementById('current-flag').src = `https://flagcdn.com/w80/${flagCode}.png`;
            
            const body = document.getElementById('race-results-body');
            body.innerHTML = "";

            const data = raceData[selectedRace] || null;

            participants.forEach(p => {
                const pre = data ? data[p][0] : 0;
                const qualy = data ? data[p][1] : 0;
                const total = pre + qualy;

                body.innerHTML += `
                    <tr>
                        <td>${p}</td>
                        <td class="points-val">${data ? pre : "-"}</td>
                        <td class="points-val">${data ? qualy : "-"}</td>
                        <td class="total-col">${data ? total : "-"}</td>
                    </tr>
                `;
            });
        }

        function showTab(tab) {
            document.getElementById('general-tab').classList.toggle('hidden', tab !== 'general');
            document.getElementById('races-tab').classList.toggle('hidden', tab !== 'races');
            document.getElementById('btn-general').classList.toggle('active', tab === 'general');
            document.getElementById('btn-races').classList.toggle('active', tab === 'races');
        }

        window.onload = init;
    </script>
</body>
</html>
