<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 PASSION GAME 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary-bg: #0d0d0d; --card-bg: #181818; --accent: #e10600; --text: #ffffff; --gold: #ffd700; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--primary-bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 2.5rem; letter-spacing: 2px; border-bottom: 4px solid var(--accent); display: inline-block; padding-bottom: 10px; }
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
        button { padding: 12px 24px; cursor: pointer; background: var(--card-bg); color: white; border: 1px solid #333; border-radius: 30px; font-weight: bold; transition: 0.3s; }
        button.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 4px 15px rgba(225, 6, 0, 0.4); }
        .container { width: 100%; max-width: 1100px; background: var(--card-bg); border-radius: 16px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); margin-bottom: 30px; }
        select { padding: 12px; background: #252525; color: white; border: 1px solid #444; border-radius: 8px; margin-bottom: 20px; width: 100%; max-width: 300px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #2a2a2a; font-size: 0.95rem; }
        th { color: #888; text-transform: uppercase; font-size: 0.75rem; }
        .winner-box { background: linear-gradient(90deg, #2c2c2c, #1a1a1a); padding: 15px 25px; border-radius: 12px; border-left: 5px solid var(--gold); margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
        .bonus-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-top: 25px; }
        .bonus-card { background: #222; padding: 15px; border-radius: 12px; border: 1px solid #333; }
        .bonus-card h4 { margin: 0 0 10px 0; color: var(--accent); border-bottom: 1px solid #333; }
        .hidden { display: none; }
        .loader { padding: 50px; text-align: center; font-size: 1.2rem; color: var(--gold); }
    </style>
</head>
<body>

    <header><h1>F1 PASSION GAME 2026</h1></header>

    <div class="nav-buttons">
        <button onclick="showTab('race-results')" id="btn-race-results" class="active">Състезания</button>
        <button onclick="showTab('predictions')" id="btn-predictions">Предварителни прогнози</button>
        <button onclick="showTab('general')" id="btn-general">Генерално класиране</button>
    </div>

    <div id="loading" class="loader">Синхронизиране с Google Sheets...</div>

    <div id="race-results-tab" class="container hidden">
        <select id="select-race-results" onchange="renderRaceResults()"></select>
        <div class="winner-box">
            <span id="res-title" style="font-size: 1.2rem; font-weight: bold;"></span>
            <div>🥇 Победител: <span id="race-winner" style="color:var(--gold); font-weight:bold;"></span></div>
        </div>
        <table>
            <thead><tr><th>Участник</th><th>Преди уикенда</th><th>След Квалиф.</th><th style="text-align:right;">ОБЩО</th></tr></thead>
            <tbody id="race-results-body"></tbody>
        </table>
    </div>

    <div id="predictions-tab" class="container hidden">
        <div style="display: flex; gap: 10px; margin-bottom:20px;">
            <select id="pred-race-select" onchange="renderPredictions()"></select>
            <select id="pred-type-select" onchange="renderPredictions()">
                <option value="Предварителна">Предварителна</option>
                <option value="След квалификация">След квалификация</option>
            </select>
        </div>
        <div style="overflow-x: auto;">
            <table id="top10-table"><thead><tr id="top10-head"></tr></thead><tbody id="top10-body"></tbody></table>
        </div>
        <div class="bonus-grid" id="bonus-container"></div>
    </div>

    <div id="general-tab" class="container hidden">
        <table id="general-table">
            <thead><tr><th>Поз.</th><th>Участник</th><th id="gen-races-head"></th><th style="text-align:right;">Общо Точки</th></tr></thead>
            <tbody id="general-body"></tbody>
        </table>
        <div style="height: 400px; margin-top: 40px;"><canvas id="mainChart"></canvas></div>
    </div>

    <script>
        const URL_RESULTS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRNZBr2YwzfMeeokxS1ZNAQUdaHJ7kQfBEhfYI0P59vtnCMHgsz3R5f8T7kz62q_K9zwmIXdkzzfoAL/pub?gid=1231783594&single=true&output=csv";
        const URL_PREDS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRNZBr2YwzfMeeokxS1ZNAQUdaHJ7kQfBEhfYI0P59vtnCMHgsz3R5f8T7kz62q_K9zwmIXdkzzfoAL/pub?gid=1360122125&single=true&output=csv";

        let rawResults = [], rawPreds = [], races = [];

        async function fetchData() {
            try {
                const [res1, res2] = await Promise.all([fetch(URL_RESULTS), fetch(URL_PREDS)]);
                const text1 = await res1.text();
                const text2 = await res2.text();
                
                rawResults = parseCSV(text1);
                rawPreds = parseCSV(text2);
                
                // Извличане на състезанията от хедъра на резултатите
                races = [];
                const header = rawResults[0];
                for(let i=1; i < header.length; i+=2) {
                    if(header[i]) races.push(header[i]);
                }

                initApp();
            } catch (e) { document.getElementById('loading').innerText = "Грешка при зареждането."; }
        }

        function parseCSV(text) {
            return text.split('\n').map(row => row.split(',').map(cell => cell.trim().replace(/"/g, '')));
        }

        function initApp() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('race-results-tab').classList.remove('hidden');
            
            const rSel = document.getElementById('select-race-results');
            const pSel = document.getElementById('pred-race-select');
            races.forEach(r => {
                rSel.add(new Option("ГП на " + r, r));
                pSel.add(new Option("ГП на " + r, r));
            });

            renderRaceResults();
            renderGeneral();
            renderPredictions();
        }

        function renderRaceResults() {
            const race = document.getElementById('select-race-results').value;
            const raceIdx = races.indexOf(race) * 2 + 1;
            const body = document.getElementById('race-results-body');
            body.innerHTML = "";

            let results = [];
            for(let i=3; i < rawResults.length; i++) {
                const row = rawResults[i];
                if(!row[0]) continue;
                const pre = parseInt(row[raceIdx]) || 0;
                const qual = parseInt(row[raceIdx+1]) || 0;
                results.push({ name: row[0], pre, qual, total: pre + qual });
            }
            results.sort((a,b) => b.total - a.total);
            
            document.getElementById('res-title').innerText = "Гран При на " + race;
            document.getElementById('race-winner').innerText = results[0]?.name || "-";

            results.forEach(r => {
                body.innerHTML += `<tr><td>${r.name}</td><td>${r.pre}</td><td>${r.qual}</td><td style="text-align:right; font-weight:bold; color:var(--gold);">${r.total}</td></tr>`;
            });
        }

        function renderPredictions() {
            const race = document.getElementById('pred-race-select').value;
            const typeKey = document.getElementById('pred-type-select').value;
            const body = document.getElementById('top10-body');
            const bonus = document.getElementById('bonus-container');
            
            body.innerHTML = ""; bonus.innerHTML = "";
            document.getElementById('top10-head').innerHTML = "<th>Участник</th>" + Array.from({length:10}, (_,i) => `<th>P${i+1}</th>`).join('');

            rawPreds.slice(1).forEach(row => {
                if(row[2]?.includes(race) && row[3]?.includes(typeKey)) {
                    let top10Cells = "";
                    for(let i=4; i<=22; i+=2) top10Cells += `<td>${row[i].split(' (')[0]}</td>`;
                    body.innerHTML += `<tr><td style="font-weight:bold; color:var(--accent);">${row[1]}</td>${top10Cells}</tr>`;
                    
                    bonus.innerHTML += `
                        <div class="bonus-card">
                            <h4>${row[1]}</h4>
                            <p>🌟 DotD: ${row[24].split(' (')[0]}</p>
                            <p>💨 Fast Lap: ${row[28].split(' (')[0]}</p>
                            <p>⚠️ DNF: ${row[26].split(' (')[0]}</p>
                            <p>🚀 Bold: ${row[30].split(' (')[0]}</p>
                        </div>`;
                }
            });
        }

        function renderGeneral() {
            const body = document.getElementById('general-body');
            body.innerHTML = "";
            let participantsData = [];

            for(let i=3; i < rawResults.length; i++) {
                const row = rawResults[i];
                if(!row[0]) continue;
                let total = 0, racePoints = [];
                for(let j=1; j < row.length; j+=2) {
                    let p = (parseInt(row[j]) || 0) + (parseInt(row[j+1]) || 0);
                    total += p;
                    racePoints.push(total);
                }
                participantsData.push({ name: row[0], total, history: racePoints });
            }
            participantsData.sort((a,b) => b.total - a.total);

            participantsData.forEach((p, idx) => {
                body.innerHTML += `<tr><td>${idx+1}</td><td>${p.name}</td><td>-</td><td style="text-align:right; font-weight:bold; color:var(--gold);">${p.total}</td></tr>`;
            });

            initChart(participantsData);
        }

        let chart;
        function initChart(data) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Старт', ...races],
                    datasets: data.map(p => ({
                        label: p.name,
                        data: [0, ...p.history],
                        borderColor: getRandomColor(),
                        tension: 0.3
                    }))
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: 'white' } } } }
            });
        }

        function getRandomColor() {
            const colors = ['#e10600', '#00d2be', '#ffeb3b', '#ffffff', '#4a90e2', '#7ed321'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function showTab(id) {
            ['race-results', 'predictions', 'general'].forEach(t => {
                document.getElementById(t + '-tab').classList.add('hidden');
                document.getElementById('btn-' + t).classList.remove('active');
            });
            document.getElementById(id + '-tab').classList.remove('hidden');
            document.getElementById('btn-' + id).classList.add('active');
        }

        fetchData();
    </script>
</body>
</html>
