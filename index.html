<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Fantasy 2026 - Official Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-bg: #0b0b0b;
            --card-bg: #1a1a1a;
            --accent-color: #e10600;
            --text-color: #ffffff;
            --gold: #ffd700;
            --up-color: #00ff00;
            --down-color: #ff4d4d;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
        }

        header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 1000px; }
        
        .nav-buttons {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 10px; margin-bottom: 20px;
        }

        button {
            padding: 12px 18px; cursor: pointer; background: var(--card-bg);
            color: white; border: 1px solid #444; border-radius: 8px;
            font-weight: bold; transition: 0.3s;
        }

        button:hover, button.active { background: var(--accent-color); border-color: var(--accent-color); }

        .container {
            width: 100%; max-width: 1000px; background: var(--card-bg);
            border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box; margin-bottom: 20px;
        }

        select {
            padding: 10px; background: #222; color: white;
            border: 1px solid var(--accent-color); border-radius: 5px;
            margin-bottom: 15px; width: 100%; max-width: 300px;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; font-size: 0.9rem; }
        th { color: var(--accent-color); text-transform: uppercase; letter-spacing: 1px; }

        .bonus-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; margin-top: 20px;
        }

        .bonus-card {
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px;
            border-left: 4px solid var(--gold);
        }

        .winner-tag { background: var(--gold); color: black; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        .hidden { display: none; }
        .flag-img { width: 40px; border-radius: 3px; vertical-align: middle; margin-right: 10px; }
        #timer { font-size: 1.2rem; color: var(--gold); font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <header>
        <div id="timer">Зареждане на таймера...</div>
        <h1>🏎️ F1 HUB: ПРОГНОЗИ 2026</h1>
    </header>

    <div class="nav-buttons">
        <button onclick="showTab('race-results')" id="btn-race-results" class="active">1. По състезание</button>
        <button onclick="showTab('predictions')" id="btn-predictions">2. Предварителни прогнози</button>
        <button onclick="showTab('general')" id="btn-general">3. Генерално класиране</button>
        <button onclick="showTab('charts')" id="btn-charts">4. Графика & Анализ</button>
    </div>

    <div id="race-results-tab" class="container">
        <select id="select-race-results" onchange="renderRaceResults()"></select>
        <div id="race-header-info">
            <h2><img src="" id="res-flag" class="flag-img"><span id="res-title"></span></h2>
            <p>🏁 Победител в състезанието: <span id="race-winner" class="winner-tag"></span></p>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Участник</th>
                    <th>Предварителна</th>
                    <th>След Квалиф.</th>
                    <th style="text-align:right; color: var(--gold);">ОБЩО</th>
                </tr>
            </thead>
            <tbody id="race-results-body"></tbody>
        </table>
    </div>

    <div id="predictions-tab" class="container hidden">
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <select id="pred-race-select" onchange="renderPredictions()"></select>
            <select id="pred-type-select" onchange="renderPredictions()">
                <option value="Предварителна - Преди уикенда да започне">Предварителна</option>
                <option value="След квалификация">След квалификация</option>
            </select>
        </div>
        <h3>Топ 10 Прогнози</h3>
        <div style="overflow-x: auto;">
            <table id="top10-table">
                <thead id="top10-head"></thead>
                <tbody id="top10-body"></tbody>
            </table>
        </div>
        <h3>Бонус Прогнози</h3>
        <div class="bonus-grid" id="bonus-container"></div>
    </div>

    <div id="general-tab" class="container hidden">
        <h2>🏆 Общо класиране и движение</h2>
        <table>
            <thead>
                <tr>
                    <th>Поз.</th>
                    <th>Δ</th>
                    <th>Участник</th>
                    <th>Австралия</th>
                    <th>Китай</th>
                    <th style="text-align:right; color: var(--gold);">Общо</th>
                </tr>
            </thead>
            <tbody id="general-body"></tbody>
        </table>
    </div>

    <div id="charts-tab" class="container hidden">
        <h2>📈 Прогрес на точките</h2>
        <div style="height: 400px; width: 100%;">
            <canvas id="mainChart"></canvas>
        </div>
    </div>

    <script>
        // ДАННИ ОТ ЕКСЕЛСКИТЕ ТАБЛИЦИ
        const participants = ["Радослав", "Георги", "Александър", "Славчо", "Димитър", "Ангел"];
        
        const calendar = [
            { id: "au", name: "Австралия", winner: "Джордж Ръсел" },
            { id: "cn", name: "Китай", winner: "Кими Антонели" },
            { id: "jp", name: "Япония", winner: "-" },
            { id: "bh", name: "Бахрейн", winner: "-" }
        ];

        // Данни от "Резултати от състезания"
        const pointsData = {
            "Австралия": {
                "Радослав": [17, 19], "Георги": [25, 16], "Александър": [14, 9],
                "Славчо": [15, 29], "Димитър": [16, 17], "Ангел": [0, 0]
            },
            "Китай": {
                "Радослав": [24, 35], "Георги": [24, 23], "Александър": [22, 27],
                "Славчо": [14, 20], "Димитър": [0, 0], "Ангел": [15, 18]
            }
        };

        // Данни от "Отговори от формуляр 1" (Примерна извадка)
        const detailedPredictions = [
            { name: "Радо", race: "1. GP Australia", type: "След квалификация", top10: ["Ръсел", "Антонели", "Люклер", "Хамилтън", "Норис", "Верстапен", "Пиастри", "Хаджар", "Гасли", "Беърман"], bonus: ["Пиастри", "Верстапен", "Верстапен", "Бортолето"] },
            { name: "Сашко", race: "2. GP China", type: "След квалификация", top10: ["Ръсел", "Антонели", "Хамилтън", "Люклер", "Пиастри", "Норис", "Верстапен", "Хаджар", "Гасли", "Хулкенберг"], bonus: ["Антонели", "Строл", "Ръсел", "Хулкенберг"] }
            // Тук могат да се добавят всички останали редове
        ];

        function init() {
            const resSelect = document.getElementById('select-race-results');
            const predSelect = document.getElementById('pred-race-select');
            
            calendar.forEach(r => {
                let opt1 = new Option("ГП на " + r.name, r.name);
                let opt2 = new Option("ГП на " + r.name, r.name);
                resSelect.add(opt1);
                predSelect.add(opt2);
            });

            startTimer();
            renderRaceResults();
            renderGeneral();
            renderPredictions();
            initChart();
        }

        function startTimer() {
            const target = new Date("March 27, 2026 06:30:00").getTime();
            setInterval(() => {
                const now = new Date().getTime();
                const d = target - now;
                const days = Math.floor(d / (86400000));
                const hours = Math.floor((d % 86400000) / 3600000);
                document.getElementById("timer").innerHTML = `Следващо: ГП на Китай 🇨🇳 (FP1) след ${days}д ${hours}ч`;
            }, 1000);
        }

        function renderRaceResults() {
            const race = document.getElementById('select-race-results').value;
            const info = calendar.find(c => c.name === race);
            document.getElementById('res-flag').src = `https://flagcdn.com/w80/${info.id}.png`;
            document.getElementById('res-title').innerText = "Гран При на " + race;
            document.getElementById('race-winner').innerText = info.winner;

            const body = document.getElementById('race-results-body');
            body.innerHTML = "";
            
            const data = pointsData[race] || {};
            participants.forEach(p => {
                const pts = data[p] || [0, 0];
                body.innerHTML += `<tr>
                    <td>${p}</td>
                    <td>${pts[0]}</td>
                    <td>${pts[1]}</td>
                    <td style="text-align:right; font-weight:bold;">${pts[0] + pts[1]}</td>
                </tr>`;
            });
        }

        function renderGeneral() {
            const body = document.getElementById('general-body');
            body.innerHTML = "";
            
            // Изчисляване на общо (Спрямо Ексел: Радослав 96, Георги 86...)
            const totals = [
                { name: "Радослав", r1: 37, r2: 59, total: 96, trend: "up" },
                { name: "Георги", r1: 39, r2: 47, total: 86, trend: "neutral" },
                { name: "Александър", r1: 34, r2: 49, total: 83, trend: "up" },
                { name: "Славчо", r1: 44, r2: 34, total: 78, trend: "down" },
                { name: "Димитър", r1: 33, r2: 0, total: 33, trend: "neutral" },
                { name: "Ангел", r1: 0, r2: 33, total: 33, trend: "neutral" }
            ].sort((a,b) => b.total - a.total);

            totals.forEach((u, i) => {
                let icon = u.trend === "up" ? '<span style="color:var(--up-color)">▲</span>' : 
                           u.trend === "down" ? '<span style="color:var(--down-color)">▼</span>' : "●";
                body.innerHTML += `<tr>
                    <td>${i+1}</td>
                    <td>${icon}</td>
                    <td>${u.name}</td>
                    <td>${u.r1}</td>
                    <td>${u.r2}</td>
                    <td style="text-align:right; font-weight:bold;">${u.total}</td>
                </tr>`;
            });
        }

        function renderPredictions() {
            const race = document.getElementById('pred-race-select').value;
            const type = document.getElementById('pred-type-select').value;
            const container = document.getElementById('bonus-container');
            const body = document.getElementById('top10-body');
            const head = document.getElementById('top10-head');

            // Филтриране на данни за избраното състезание
            const filtered = detailedPredictions.filter(p => p.race.includes(race) && p.type === type);

            if (filtered.length === 0) {
                body.innerHTML = "<tr><td colspan='11'>Няма данни за тази прогноза</td></tr>";
                container.innerHTML = "";
                return;
            }

            head.innerHTML = "<tr><th>Участник</th>" + Array.from({length: 10}, (_, i) => `<th>P${i+1}</th>`).join('') + "</tr>";
            body.innerHTML = filtered.map(f => `<tr><td>${f.name}</td>${f.top10.map(p => `<td>${p}</td>`).join('')}</tr>`).join('');

            container.innerHTML = filtered.map(f => `
                <div class="bonus-card">
                    <strong>${f.name}</strong><br>
                    <small>🏎️ Бърза обиколка: ${f.bonus[2]}</small><br>
                    <small>❌ DNF: ${f.bonus[1]}</small><br>
                    <small>⭐ Пилот на деня: ${f.bonus[0]}</small><br>
                    <small>🚀 Bold Pick: ${f.bonus[3]}</small>
                </div>
            `).join('');
        }

        function initChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Старт', 'Австралия', 'Китай'],
                    datasets: [
                        { label: 'Радослав', data: [0, 37, 96], borderColor: '#00d2be', tension: 0.2 },
                        { label: 'Георги', data: [0, 39, 86], borderColor: '#ffeb3b', tension: 0.2 },
                        { label: 'Александър', data: [0, 34, 83], borderColor: '#e10600', tension: 0.2 },
                        { label: 'Славчо', data: [0, 44, 78], borderColor: '#ffffff', tension: 0.2 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: {color: 'white'}}} }
            });
        }

        function showTab(id) {
            document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.nav-buttons button').forEach(b => b.classList.remove('active'));
            document.getElementById(id + '-tab').classList.remove('hidden');
            document.getElementById('btn-' + id).classList.add('active');
        }

        window.onload = init;
    </script>
</body>
</html>
