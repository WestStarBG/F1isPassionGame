<script>
    const URL_RESULTS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRNZBr2YwzfMeeokxS1ZNAQUdaHJ7kQfBEhfYI0P59vtnCMHgsz3R5f8T7kz62q_K9zwmIXdkzzfoAL/pub?gid=1231783594&single=true&output=csv";
    const URL_PREDS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRNZBr2YwzfMeeokxS1ZNAQUdaHJ7kQfBEhfYI0P59vtnCMHgsz3R5f8T7kz62q_K9zwmIXdkzzfoAL/pub?gid=1360122125&single=true&output=csv";

    const flagMapping = {
        "Австралия": "au", "Китай": "cn", "Япония": "jp", "Бахрейн": "bh",
        "Саудитска Арабия": "sa", "Маями": "us", "Канада": "ca", "Монако": "mc",
        "Испания": "es", "Австрия": "at", "Великобритания": "gb", "Унгария": "hu"
    };

    let rawResults = [], rawPreds = [], races = [];

    async function fetchData() {
        try {
            const [res1, res2] = await Promise.all([
                fetch(URL_RESULTS).then(r => r.text()),
                fetch(URL_PREDS).then(r => r.text())
            ]);

            rawResults = parseCSV(res1);
            rawPreds = parseCSV(res2);

            const header = rawResults[0] || [];
            races = [];
            for (let i = 1; i < header.length; i += 2) {
                if (header[i]) races.push(cleanCell(header[i]));
            }

            document.getElementById('loading').classList.add('hidden');
            initApp();

            console.log("rawResults:", rawResults);
            console.log("rawPreds:", rawPreds);
            console.log("races:", races);
        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerText = "Грешка при синхронизацията.";
        }
    }

    function parseCSV(text) {
        const lines = text.split(/\r?\n/).filter(l => l.trim());

        return lines.map(line => {
            let res = [];
            let cur = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                const next = line[i + 1];

                if (char === '"' && inQuotes && next === '"') {
                    cur += '"';
                    i++;
                } else if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    res.push(cur.trim());
                    cur = '';
                } else {
                    cur += char;
                }
            }

            res.push(cur.trim());
            return res;
        });
    }

    function norm(str) {
        return (str || "")
            .toString()
            .toLowerCase()
            .replace(/"/g, '')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function cleanCell(val) {
        return (val || "").toString().replace(/"/g, '').trim();
    }

    function cleanName(val) {
        return val ? cleanCell(val).split('(')[0].trim() : "-";
    }

    function initApp() {
        const rSel = document.getElementById('select-race-results');
        const pSel = document.getElementById('pred-race-select');

        rSel.innerHTML = "";
        pSel.innerHTML = "";

        races.forEach(r => {
            rSel.add(new Option("Гран При на " + r, r));
            pSel.add(new Option("Гран При на " + r, r));
        });

        showTab('race-results');
        renderRaceResults();
        renderGeneral();
        renderPredictions();
    }

    function renderRaceResults() {
        const race = document.getElementById('select-race-results').value;
        const raceIdx = races.indexOf(race) * 2 + 1;
        const body = document.getElementById('race-results-body');
        body.innerHTML = "";

        document.getElementById('res-flag').src = `https://flagcdn.com/w160/${flagMapping[race] || 'un'}.png`;
        document.getElementById('res-title').innerText = "РЕЗУЛТАТИ: " + race;

        let results = [];
        for (let i = 3; i < rawResults.length; i++) {
            const row = rawResults[i];
            if (!row[0] || cleanCell(row[0]) === "Участник") continue;

            const pre = parseInt(row[raceIdx]) || 0;
            const qual = parseInt(row[raceIdx + 1]) || 0;
            results.push({ name: cleanCell(row[0]), pre, qual, total: pre + qual });
        }

        results.sort((a, b) => b.total - a.total);
        document.getElementById('race-winner').innerText = results[0]?.name || "---";

        results.forEach(r => {
            body.innerHTML += `<tr>
                <td style="text-align:left; font-weight:bold; font-size:1.3rem;">${r.name}</td>
                <td>${r.pre}</td>
                <td>${r.qual}</td>
                <td style="text-align:right; font-weight:bold; color:var(--gold); font-size:1.4rem;">${r.total}</td>
            </tr>`;
        });
    }

    function matchPredictionType(typeCell, wantedType) {
        const txt = norm(typeCell);

        if (wantedType === "pre") {
            return txt.includes("предварител");
        }

        if (wantedType === "qual") {
            return txt.includes("след квалификация") || txt.includes("квалифика");
        }

        return false;
    }

    function renderPredictions() {
        const selectedRace = document.getElementById('pred-race-select').value;
        const content = document.getElementById('preds-content');
        content.innerHTML = "";

        const types = [
            { label: "📍 Предварителни прогнози", key: "pre" },
            { label: "🏁 Прогнози след квалификация", key: "qual" }
        ];

        types.forEach(type => {
            try {
                const filtered = rawPreds.filter((row, index) => {
                    if (!row || row.length < 4) return false;

                    const raceCell = norm(row[2]);
                    const typeCell = row[3] || "";

                    const raceMatch = raceCell.includes(norm(selectedRace));
                    const typeMatch = matchPredictionType(typeCell, type.key);

                    if (index < 10) {
                        console.log("Row check:", {
                            index,
                            row,
                            selectedRace,
                            raceCell,
                            typeCell,
                            raceMatch,
                            typeMatch
                        });
                    }

                    return raceMatch && typeMatch;
                });

                if (filtered.length > 0) {
                    let html = `<div class="section-title">${type.label}</div>
                        <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th style="text-align:left">Участник</th>`;

                    for (let i = 1; i <= 10; i++) html += `<th>P${i}</th>`;

                    html += `       </tr>
                            </thead>
                            <tbody>`;

                    let bonusCards = `<div class="bonus-grid">`;

                    filtered.forEach(row => {
                        html += `<tr>
                            <td style="text-align:left; font-weight:bold; color:var(--accent);">${cleanCell(row[1]) || "-"}</td>`;

                        for (let i = 4; i <= 22; i += 2) {
                            html += `<td>${cleanName(row[i])}</td>`;
                        }

                        html += `</tr>`;

                        bonusCards += `<div class="bonus-card">
                            <h4>${cleanCell(row[1]) || "-"}</h4>
                            <b>🌟 DotD:</b> ${cleanName(row[24])}<br>
                            <b>💨 Най-бърза обиколка:</b> ${cleanName(row[28])}<br>
                            <b>⚠️ DNF Pick:</b> ${cleanName(row[26])}<br>
                            <b>🚀 Bold Pick:</b> ${cleanName(row[30])}
                        </div>`;
                    });

                    bonusCards += `</div>`;
                    html += `</tbody></table></div>`;

                    content.innerHTML += html + bonusCards;
                }
            } catch (e) {
                console.warn("Грешка при зареждане на тип:", type.label, e);
            }
        });

        if (!content.innerHTML) {
            content.innerHTML = "<p style='text-align:center; padding:50px; font-size:1.2rem; color:#666;'>Все още няма подадени прогнози за този старт.</p>";
        }
    }

    function renderGeneral() {
        const body = document.getElementById('general-body');
        body.innerHTML = "";
        let dataChart = [];

        for (let i = 3; i < rawResults.length; i++) {
            const row = rawResults[i];
            if (!row[0] || cleanCell(row[0]) === "Участник") continue;

            let total = 0, history = [];
            for (let j = 1; j < row.length; j += 2) {
                total += (parseInt(row[j]) || 0) + (parseInt(row[j + 1]) || 0);
                history.push(total);
            }

            dataChart.push({ name: cleanCell(row[0]), total, history });
        }

        dataChart
            .sort((a, b) => b.total - a.total)
            .forEach((p, idx) => {
                body.innerHTML += `<tr>
                    <td style="width:50px;">${idx + 1}</td>
                    <td style="text-align:left; font-weight:bold; font-size:1.4rem;">${p.name}</td>
                    <td style="text-align:right; font-weight:bold; color:var(--gold); font-size:1.5rem;">${p.total}</td>
                </tr>`;
            });

        initChart(dataChart);
    }

    let chart;
    function initChart(data) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if (chart) chart.destroy();

        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Старт', ...races],
                datasets: data.map((p, i) => ({
                    label: p.name,
                    data: [0, ...p.history],
                    borderColor: ['#e10600', '#00d2be', '#ffeb3b', '#ffffff', '#4a90e2', '#ff9800', '#9c27b0'][i % 7],
                    tension: 0.3,
                    borderWidth: 4,
                    pointRadius: 5,
                    pointHoverRadius: 8
                }))
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: 'white',
                            padding: 20,
                            font: { size: 12 }
                        }
                    }
                },
                scales: {
                    y: {
                        ticks: { color: '#888', font: { size: 12 } },
                        grid: { color: '#222' }
                    },
                    x: {
                        ticks: { color: '#888', font: { size: 12 } },
                        grid: { display: false }
                    }
                }
            }
        });
    }

    function showTab(id) {
        ['race-results', 'predictions', 'general'].forEach(t => {
            document.getElementById(t + '-tab').classList.add('hidden');
            document.getElementById('btn-' + t).classList.remove('active');
        });

        document.getElementById(id + '-tab').classList.remove('hidden');
        document.getElementById('btn-' + id).classList.add('active');
    }

    fetchData();
</script>
