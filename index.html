<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 PASSION GAME 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary-bg: #0d0d0d; --card-bg: #181818; --accent: #e10600; --text: #ffffff; --gold: #ffd700; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--primary-bg); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        header h1 { font-size: 2rem; border-bottom: 3px solid var(--accent); padding-bottom: 5px; }
        .nav-buttons { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        button { padding: 10px 18px; cursor: pointer; background: var(--card-bg); color: white; border: 1px solid #333; border-radius: 20px; font-weight: bold; transition: 0.3s; font-size: 0.9rem; }
        button.active { background: var(--accent); border-color: var(--accent); }
        .container { width: 100%; max-width: 1100px; background: var(--card-bg); border-radius: 12px; padding: 15px; box-sizing: border-box; margin-bottom: 20px; }
        select { padding: 12px; background: #252525; color: white; border: 1px solid #444; border-radius: 8px; margin-bottom: 20px; width: 100%; font-size: 1rem; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; display: block; overflow-x: auto; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #2a2a2a; font-size: 0.85rem; white-space: nowrap; }
        th { color: #888; text-transform: uppercase; font-size: 0.7rem; }
        .section-title { color: var(--gold); margin: 30px 0 10px 0; border-left: 4px solid var(--accent); padding-left: 10px; font-size: 1.1rem; font-weight: bold; }
        .bonus-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 30px; }
        .bonus-card { background: #222; padding: 12px; border-radius: 8px; border: 1px solid #333; font-size: 0.8rem; line-height: 1.4; }
        .bonus-card h4 { margin: 0 0 8px 0; color: var(--accent); border-bottom: 1px solid #333; }
        .hidden { display: none; }
        .loader { padding: 50px; text-align: center; color: var(--gold); }
    </style>
</head>
<body>

    <header><h1>F1 PASSION GAME</h1></header>

    <div class="nav-buttons">
        <button onclick="showTab('race-results')" id="btn-race-results" class="active">Състезания</button>
        <button onclick="showTab('predictions')" id="btn-predictions">Предварителни прогнози</button>
        <button onclick="showTab('general')" id="btn-general">Генерално класиране</button>
    </div>

    <div id="loading" class="loader">Зареждане на данни от Ексел...</div>

    <div id="race-results-tab" class="container hidden">
        <select id="select-race-results" onchange="renderRaceResults()"></select>
        <h3 id="res-title" style="color:var(--gold)"></h3>
        <table>
            <thead><tr><th>Участник</th><th>Преди уикенда</th><th>След Квалиф.</th><th style="text-align:right;">ОБЩО</th></tr></thead>
            <tbody id="race-results-body"></tbody>
        </table>
    </div>

    <div id="predictions-tab" class="container hidden">
        <select id="pred-race-select" onchange="renderPredictions()"></select>
        <div id="preds-content"></div>
    </div>

    <div id="general-tab" class="container hidden">
        <table>
            <thead><tr><th>Поз.</th><th>Участник</th><th style="text-align:right;">Общо Точки</th></tr></thead>
            <tbody id="general-body"></tbody>
        </table>
        <div style="height: 350px; margin-top: 20px;"><canvas id="mainChart"></canvas></div>
    </div>

    <script>
        const URL_RESULTS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRNZBr2YwzfMeeokxS1ZNAQUdaHJ7kQfBEhfYI0P59vtnCMHgsz3R5f8T7kz62q_K9zwmIXdkzzfoAL/pub?gid=1231783594&single=true&output=csv";
        const URL_PREDS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRNZBr2YwzfMeeokxS1ZNAQUdaHJ7kQfBEhfYI0P59vtnCMHgsz3R5f8T7kz62q_K9zwmIXdkzzfoAL/pub?gid=1360122125&single=true&output=csv";

        // Карта за превод, за да намираме мачовете между БГ и АНГ имената в Ексела
        const raceMapping = {
            "Австралия": "Australia",
            "Китай": "China",
            "Япония": "Japan",
            "Бахрейн": "Bahrain"
        };

        let rawResults = [], rawPreds = [], races = [];

        async function fetchData() {
            try {
                const [res1, res2] = await Promise.all([
                    fetch(URL_RESULTS).then(r => r.text()),
                    fetch(URL_PREDS).then(r => r.text())
                ]);
                
                rawResults = parseCSV(res1);
                rawPreds = parseCSV(res2);
                
                const header = rawResults[0];
                for(let i=1; i < header.length; i+=2) { if(header[i]) races.push(header[i]); }

                document.getElementById('loading').classList.add('hidden');
                initApp();
            } catch (e) { 
                console.error(e);
                document.getElementById('loading').innerText = "Грешка при зареждане. Провери интернет връзката."; 
            }
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            return lines.map(line => {
                const result = [];
                let cur = '', inQuotes = false;
                for (let char of line) {
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { result.push(cur.trim()); cur = ''; }
                    else cur += char;
                }
                result.push(cur.trim());
                return result;
            });
        }

        function initApp() {
            const rSel = document.getElementById('select-race-results');
            const pSel = document.getElementById('pred-race-select');
            races.forEach(r => {
                rSel.add(new Option("ГП на " + r, r));
                pSel.add(new Option("ГП на " + r, r));
            });
            showTab('race-results');
            renderRaceResults();
            renderGeneral();
            renderPredictions();
        }

        function cleanName(val) { 
            if(!val) return "-";
            return val.split('(')[0].trim().replace(/"/g, ''); 
        }

        function renderPredictions() {
            const selectedRaceBG = document.getElementById('pred-race-select').value;
            const selectedRaceEN = raceMapping[selectedRaceBG] || selectedRaceBG;
            const content = document.getElementById('preds-content');
            content.innerHTML = "";

            const types = [
                { label: "📍 Предварителна прогноза", filter: "Предварителна" },
                { label: "🏁 Прогноза след квалификация", filter: "След квалификация" }
            ];

            types.forEach(type => {
                // Търсим редове, които съдържат името на състезанието (на БГ или АНГ)
                const filtered = rawPreds.filter(row => {
                    if(!row[2] || !row[3]) return false;
                    const raceCell = row[2].toLowerCase();
                    const isCorrectRace = raceCell.includes(selectedRaceBG.toLowerCase()) || raceCell.includes(selectedRaceEN.toLowerCase());
                    const isCorrectType = row[3].includes(type.filter);
                    return isCorrectRace && isCorrectType;
                });

                if(filtered.length > 0) {
                    let html = `<div class="section-title">${type.label}</div>`;
                    html += `<table><thead><tr><th>Участник</th>`;
                    for(let i=1; i<=10; i++) html += `<th>P${i}</th>`;
                    html += `</tr></thead><tbody>`;

                    let bonusCards = `<div class="bonus-grid">`;

                    filtered.forEach(row => {
                        html += `<tr><td style="font-weight:bold; color:var(--accent);">${row[1]}</td>`;
                        for(let i=4; i<=22; i+=2) html += `<td>${cleanName(row[i])}</td>`;
                        html += `</tr>`;

                        bonusCards += `
                            <div class="bonus-card">
                                <h4>${row[1]}</h4>
                                <b>🌟 DotD:</b> ${cleanName(row[24])}<br>
                                <b>💨 Fast Lap:</b> ${cleanName(row[28])}<br>
                                <b>⚠️ DNF:</b> ${cleanName(row[26])}<br>
                                <b>🚀 Bold:</b> ${cleanName(row[30])}
                            </div>`;
                    });
                    html += `</tbody></table>` + bonusCards + `</div>`;
                    content.innerHTML += html;
                }
            });

            if(!content.innerHTML) {
                content.innerHTML = "<p style='text-align:center; color:#666; padding:20px;'>Няма открити прогнози за това състезание в Ексела.</p>";
            }
        }

        function renderRaceResults() {
            const race = document.getElementById('select-race-results').value;
            const raceIdx = races.indexOf(race) * 2 + 1;
            const body = document.getElementById('race-results-body');
            body.innerHTML = "";
            let results = [];
            for(let i=3; i < rawResults.length; i++) {
                const row = rawResults[i];
                if(!row[0] || row[0] === "Участник") continue;
                const pre = parseInt(row[raceIdx]) || 0;
                const qual = parseInt(row[raceIdx+1]) || 0;
                results.push({ name: row[0], pre, qual, total: pre + qual });
            }
            results.sort((a,b) => b.total - a.total);
            document.getElementById('res-title').innerText = "Резултати: " + race;
            results.forEach(r => {
                body.innerHTML += `<tr><td>${r.name}</td><td>${r.pre}</td><td>${r.qual}</td><td style="text-align:right; font-weight:bold; color:var(--gold);">${r.total}</td></tr>`;
            });
        }

        function renderGeneral() {
            const body = document.getElementById('general-body');
            body.innerHTML = "";
            let dataChart = [];
            for(let i=3; i < rawResults.length; i++) {
                const row = rawResults[i];
                if(!row[0] || row[0] === "Участник") continue;
                let total = 0, history = [];
                for(let j=1; j < row.length; j+=2) {
                    total += (parseInt(row[j]) || 0) + (parseInt(row[j+1]) || 0);
                    history.push(total);
                }
                dataChart.push({ name: row[0], total, history });
            }
            dataChart.sort((a,b) => b.total - a.total).forEach((p, idx) => {
                body.innerHTML += `<tr><td>${idx+1}</td><td style="font-weight:bold;">${p.name}</td><td style="text-align:right; font-weight:bold; color:var(--gold);">${p.total}</td></tr>`;
            });
            initChart(dataChart);
        }

        let chart;
        function initChart(data) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Старт', ...races],
                    datasets: data.map((p, i) => ({
                        label: p.name, data: [0, ...p.history],
                        borderColor: ['#e10600', '#00d2be', '#ffeb3b', '#ffffff', '#4a90e2', '#ff9800'][i % 6],
                        tension: 0.3, borderWidth: 3, pointRadius: 4
                    }))
                },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: 'white', font: { size: 10 } } } },
                    scales: { y: { ticks: { color: '#888' }, grid: { color: '#222' } }, x: { ticks: { color: '#888' }, grid: { display: false } } }
                }
            });
        }

        function showTab(id) {
            ['race-results', 'predictions', 'general'].forEach(t => {
                document.getElementById(t + '-tab').classList.add('hidden');
                document.getElementById('btn-' + t).classList.remove('active');
            });
            document.getElementById(id + '-tab').classList.remove('hidden');
            document.getElementById('btn-' + id).classList.add('active');
        }

        fetchData();
    </script>
</body>
</html>
