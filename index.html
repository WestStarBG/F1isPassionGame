<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 PASSION GAME 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --primary-bg: #0d0d0d; 
            --card-bg: #181818; 
            --accent: #e10600; 
            --text: #ffffff; 
            --gold: #ffd700; 
        }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--primary-bg); 
            color: var(--text); 
            margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; 
        }

        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 3rem; letter-spacing: 3px; border-bottom: 5px solid var(--accent); display: inline-block; padding-bottom: 10px; margin: 0; text-transform: uppercase; }

        .nav-buttons { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
        button { 
            padding: 16px 32px; cursor: pointer; background: var(--card-bg); 
            color: white; border: 1px solid #333; border-radius: 35px; 
            font-weight: bold; transition: all 0.3s ease; font-size: 1.1rem; 
        }
        button:hover { border-color: var(--accent); background: #222; }
        button.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 4px 20px rgba(225, 6, 0, 0.5); }

        .container { 
            width: 100%; max-width: 1200px; background: var(--card-bg); 
            border-radius: 24px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); 
            margin-bottom: 40px; box-sizing: border-box; border: 1px solid #252525;
            display: flex; flex-direction: column; align-items: center;
        }

        select { 
            padding: 16px; background: #252525; color: white; 
            border: 2px solid #444; border-radius: 12px; 
            margin-bottom: 30px; width: 100%; max-width: 450px; 
            font-size: 1.2rem; cursor: pointer; text-align: center;
        }

        /* Таблици - Центрирани и големи */
        .table-wrapper { width: 100%; overflow-x: auto; margin-top: 10px; display: flex; justify-content: center; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; min-width: 800px; }
        th, td { padding: 20px; text-align: center; border-bottom: 1px solid #2a2a2a; font-size: 1.2rem; }
        th { color: #888; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; background: #1a1a1a; }
        tr:hover { background: #1f1f1f; }
        
        /* Победител и Знаме */
        .race-header {
            display: flex; align-items: center; justify-content: center; gap: 25px; margin-bottom: 25px; width: 100%;
        }
        .flag-img { width: 80px; height: auto; border-radius: 8px; border: 2px solid #333; }
        
        .winner-box { 
            background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 100%); 
            padding: 25px; border-radius: 18px; border: 1px solid var(--gold); 
            margin-bottom: 35px; display: flex; align-items: center; justify-content: center; gap: 20px;
            font-size: 1.5rem; width: 100%; max-width: 800px; box-shadow: 0 10px 30px rgba(255, 215, 0, 0.1);
        }
        .winner-name { color: var(--gold); font-weight: 900; text-transform: uppercase; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }

        .section-title { 
            color: var(--gold); margin: 50px 0 25px 0; border-left: 6px solid var(--accent); 
            padding-left: 20px; font-size: 1.8rem; font-weight: bold; align-self: flex-start;
        }

        .bonus-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
            gap: 25px; width: 100%; margin-top: 20px;
        }
        .bonus-card { 
            background: #202020; padding: 25px; border-radius: 18px; border: 1px solid #333; 
            font-size: 1.1rem; line-height: 1.7; transition: 0.3s ease;
        }
        .bonus-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .bonus-card h4 { margin: 0 0 15px 0; color: var(--accent); border-bottom: 2px solid #333; padding-bottom: 10px; font-size: 1.3rem; }
        
        .hidden { display: none; }
        .loader { padding: 100px; text-align: center; font-size: 1.8rem; color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

    <header><h1>F1 PASSION GAME 2026</h1></header>

    <div class="nav-buttons">
        <button onclick="showTab('race-results')" id="btn-race-results" class="active">Състезания</button>
        <button onclick="showTab('predictions')" id="btn-predictions">Предварителни прогнози</button>
        <button onclick="showTab('general')" id="btn-general">Генерално класиране</button>
    </div>

    <div id="loading" class="loader">⚙️ СИНХРОНИЗИРАНЕ...</div>

    <div id="race-results-tab" class="container hidden">
        <select id="select-race-results" onchange="renderRaceResults()"></select>
        
        <div class="race-header">
            <img id="res-flag" class="flag-img" src="">
            <h2 id="res-title" style="margin:0; font-size: 2.2rem;"></h2>
        </div>

        <div id="winner-container" class="winner-box">
            <span>🏆 ПОБЕДИТЕЛ:</span>
            <span id="race-winner" class="winner-name">---</span>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="text-align:left;">Участник</th>
                        <th>Предварителна</th>
                        <th>След Квалиф.</th>
                        <th style="text-align:right; color: var(--gold);">ОБЩО</th>
                    </tr>
                </thead>
                <tbody id="race-results-body"></tbody>
            </table>
        </div>
    </div>

    <div id="predictions-tab" class="container hidden">
        <select id="pred-race-select" onchange="renderPredictions()"></select>
        <div id="preds-content" style="width:100%"></div>
    </div>

    <div id="general-tab" class="container hidden">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Поз.</th>
                        <th style="text-align:left;">Участник</th>
                        <th style="text-align:right; color: var(--gold);">ОБЩО ТОЧКИ</th>
                    </tr>
                </thead>
                <tbody id="general-body"></tbody>
            </table>
        </div>
        <div style="height: 500px; width:100%; margin-top: 40px; background: #111; padding: 25px; border-radius: 20px; box-sizing: border-box;">
            <canvas id="mainChart"></canvas>
        </div>
    </div>

    <script>
        const URL_RESULTS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRNZBr2YwzfMeeokxS1ZNAQUdaHJ7kQfBEhfYI0P59vtnCMHgsz3R5f8T7kz62q_K9zwmIXdkzzfoAL/pub?gid=1231783594&single=true&output=csv";
        const URL_PREDS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRNZBr2YwzfMeeokxS1ZNAQUdaHJ7kQfBEhfYI0P59vtnCMHgsz3R5f8T7kz62q_K9zwmIXdkzzfoAL/pub?gid=1360122125&single=true&output=csv";

        const flagMapping = {
            "Австралия": "au", "Китай": "cn", "Япония": "jp", "Бахрейн": "bh", 
            "Саудитска Арабия": "sa", "Маями": "us", "Канада": "ca", "Монако": "mc", 
            "Испания": "es", "Австрия": "at", "Великобритания": "gb", "Унгария": "hu"
        };

        let rawResults = [], rawPreds = [], races = [];

        async function fetchData() {
            try {
                const [res1, res2] = await Promise.all([
                    fetch(URL_RESULTS).then(r => r.text()),
                    fetch(URL_PREDS).then(r => r.text())
                ]);
                rawResults = parseCSV(res1);
                rawPreds = parseCSV(res2);
                
                const header = rawResults[0];
                for(let i=1; i < header.length; i+=2) { if(header[i]) races.push(header[i]); }
                document.getElementById('loading').classList.add('hidden');
                initApp();
            } catch (e) { document.getElementById('loading').innerText = "Грешка при синхронизацията."; }
        }

        function parseCSV(text) {
            return text.split(/\r?\n/).filter(l => l.trim()).map(line => {
                let res = [], cur = '', inQuotes = false;
                for (let char of line) {
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { res.push(cur.trim()); cur = ''; }
                    else cur += char;
                }
                res.push(cur.trim());
                return res;
            });
        }

        function initApp() {
            const rSel = document.getElementById('select-race-results');
            const pSel = document.getElementById('pred-race-select');
            races.forEach(r => {
                rSel.add(new Option("Гран При на " + r, r));
                pSel.add(new Option("Гран При на " + r, r));
            });
            showTab('race-results');
            renderRaceResults();
            renderGeneral();
            renderPredictions();
        }

        function cleanName(val) { return val ? val.split('(')[0].trim().replace(/"/g, '') : "-"; }

        function renderRaceResults() {
            const race = document.getElementById('select-race-results').value;
            const raceIdx = races.indexOf(race) * 2 + 1;
            const body = document.getElementById('race-results-body');
            body.innerHTML = "";

            document.getElementById('res-flag').src = `https://flagcdn.com/w160/${flagMapping[race] || 'un'}.png`;
            document.getElementById('res-title').innerText = "РЕЗУЛТАТИ: " + race;

            let results = [];
            for(let i=3; i < rawResults.length; i++) {
                const row = rawResults[i];
                if(!row[0] || row[0] === "Участник") continue;
                const pre = parseInt(row[raceIdx]) || 0;
                const qual = parseInt(row[raceIdx+1]) || 0;
                results.push({ name: row[0], pre, qual, total: pre + qual });
            }
            results.sort((a,b) => b.total - a.total);
            document.getElementById('race-winner').innerText = results[0]?.name || "---";

            results.forEach(r => {
                body.innerHTML += `<tr>
                    <td style="text-align:left; font-weight:bold; font-size:1.3rem;">${r.name}</td>
                    <td>${r.pre}</td>
                    <td>${r.qual}</td>
                    <td style="text-align:right; font-weight:bold; color:var(--gold); font-size:1.4rem;">${r.total}</td>
                </tr>`;
            });
        }

        function renderPredictions() {
            const selectedRace = document.getElementById('pred-race-select').value;
            const content = document.getElementById('preds-content');
            content.innerHTML = "";

            const types = [
                { label: "📍 Предварителни прогнози", filter: "Предварителна" },
                { label: "🏁 Прогнози след квалификация", filter: "След квалификация" }
            ];

            types.forEach(type => {
                try {
                    const filtered = rawPreds.filter(row => row[2] && row[2].includes(selectedRace) && row[3] && row[3].includes(type.filter));
                    
                    if(filtered.length > 0) {
                        let html = `<div class="section-title">${type.label}</div><div class="table-wrapper"><table><thead><tr><th style="text-align:left">Участник</th>`;
                        for(let i=1; i<=10; i++) html += `<th>P${i}</th>`;
                        html += `</tr></thead><tbody>`;
                        let bonusCards = `<div class="bonus-grid">`;

                        filtered.forEach(row => {
                            html += `<tr><td style="text-align:left; font-weight:bold; color:var(--accent);">${row[1]}</td>`;
                            for(let i=4; i<=22; i+=2) html += `<td>${cleanName(row[i])}</td>`;
                            html += `</tr>`;
                            bonusCards += `<div class="bonus-card"><h4>${row[1]}</h4>
                                <b>🌟 DotD:</b> ${cleanName(row[24])}<br>
                                <b>💨 Най-бърза обиколка:</b> ${cleanName(row[28])}<br>
                                <b>⚠️ DNF Pick:</b> ${cleanName(row[26])}<br>
                                <b>🚀 Bold Pick:</b> ${cleanName(row[30])}</div>`;
                        });
                        content.innerHTML += html + `</tbody></table></div>` + bonusCards + `</div>`;
                    }
                } catch(e) { console.warn("Грешка при зареждане на тип:", type.filter); }
            });

            if(!content.innerHTML) content.innerHTML = "<p style='text-align:center; padding:50px; font-size:1.2rem; color:#666;'>Все още няма подадени прогнози за този старт.</p>";
        }

        function renderGeneral() {
            const body = document.getElementById('general-body');
            body.innerHTML = "";
            let dataChart = [];
            for(let i=3; i < rawResults.length; i++) {
                const row = rawResults[i];
                if(!row[0] || row[0] === "Участник") continue;
                let total = 0, history = [];
                for(let j=1; j < row.length; j+=2) {
                    total += (parseInt(row[j]) || 0) + (parseInt(row[j+1]) || 0);
                    history.push(total);
                }
                dataChart.push({ name: row[0], total, history });
            }
            dataChart.sort((a,b) => b.total - a.total).forEach((p, idx) => {
                body.innerHTML += `<tr>
                    <td style="width:50px;">${idx+1}</td>
                    <td style="text-align:left; font-weight:bold; font-size:1.4rem;">${p.name}</td>
                    <td style="text-align:right; font-weight:bold; color:var(--gold); font-size:1.5rem;">${p.total}</td>
                </tr>`;
            });
            initChart(dataChart);
        }

        let chart;
        function initChart(data) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Старт', ...races],
                    datasets: data.map((p, i) => ({
                        label: p.name, data: [0, ...p.history],
                        borderColor: ['#e10600', '#00d2be', '#ffeb3b', '#ffffff', '#4a90e2', '#ff9800', '#9c27b0'][i % 7],
                        tension: 0.3, borderWidth: 4, pointRadius: 5, pointHoverRadius: 8
                    }))
                },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: 'white', padding: 20, font: { size: 12 } } } },
                    scales: { 
                        y: { ticks: { color: '#888', font: { size: 12 } }, grid: { color: '#222' } },
                        x: { ticks: { color: '#888', font: { size: 12 } }, grid: { display: false } }
                    }
                }
            });
        }

        function showTab(id) {
            ['race-results', 'predictions', 'general'].forEach(t => {
                document.getElementById(t + '-tab').classList.add('hidden');
                document.getElementById('btn-' + t).classList.remove('active');
            });
            document.getElementById(id + '-tab').classList.remove('hidden');
            document.getElementById('btn-' + id).classList.add('active');
        }

        fetchData();
    </script>
</body>
</html>
