<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 PASSION GAME 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary-bg: #0d0d0d; --card-bg: #181818; --accent: #e10600; --text: #ffffff; --gold: #ffd700; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--primary-bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        header h1 { font-size: 2.5rem; border-bottom: 5px solid var(--accent); padding-bottom: 10px; margin-bottom: 30px; text-transform: uppercase; }
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 30px; }
        button { padding: 12px 24px; cursor: pointer; background: var(--card-bg); color: white; border: 1px solid #333; border-radius: 25px; font-weight: bold; transition: 0.3s; }
        button.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 4px 15px rgba(225, 6, 0, 0.4); }
        .container { width: 100%; max-width: 1100px; background: var(--card-bg); border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); margin-bottom: 30px; box-sizing: border-box; }
        select { padding: 15px; background: #252525; color: white; border: 1px solid #444; border-radius: 10px; margin-bottom: 25px; width: 100%; max-width: 400px; font-size: 1.1rem; display: block; margin-left: auto; margin-right: auto; }
        .table-wrapper { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #2a2a2a; font-size: 1.1rem; }
        th { color: #888; text-transform: uppercase; font-size: 0.8rem; }
        .race-header { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .flag-img { width: 60px; border-radius: 4px; }
        .winner-box { background: linear-gradient(90deg, #2c2c2c, #1a1a1a); padding: 20px; border-radius: 15px; border-left: 6px solid var(--gold); margin-bottom: 30px; text-align: center; font-size: 1.3rem; width: 100%; box-sizing: border-box; }
        .section-title { color: var(--gold); margin: 40px 0 15px 0; border-left: 5px solid var(--accent); padding-left: 15px; font-size: 1.4rem; font-weight: bold; }
        .bonus-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 15px; }
        .bonus-card { background: #222; padding: 15px; border-radius: 12px; border: 1px solid #333; font-size: 0.95rem; }
        .bonus-card h4 { margin: 0 0 10px 0; color: var(--accent); border-bottom: 1px solid #333; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <header><h1>F1 PASSION GAME 2026</h1></header>

    <div class="nav-buttons">
        <button onclick="showTab('race-results')" id="btn-race-results" class="active">Състезания</button>
        <button onclick="showTab('predictions')" id="btn-predictions">Прогнози</button>
        <button onclick="showTab('general')" id="btn-general">Класиране</button>
    </div>

    <div id="race-results-tab" class="container">
        <select id="select-race-results" onchange="renderRaceResults()"></select>
        <div class="race-header">
            <img id="res-flag" class="flag-img" src="">
            <h2 id="res-title"></h2>
        </div>
        <div class="winner-box">🏆 ПОБЕДИТЕЛ: <span id="race-winner" style="color:var(--gold); font-weight:bold;"></span></div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Участник</th><th>Предварителна</th><th>След Квалиф.</th><th style="text-align:right;">ОБЩО</th></tr></thead>
                <tbody id="race-results-body"></tbody>
            </table>
        </div>
    </div>

    <div id="predictions-tab" class="container hidden">
        <select id="pred-race-select" onchange="renderPredictions()"></select>
        <div id="preds-content"></div>
    </div>

    <div id="general-tab" class="container hidden">
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Поз.</th><th>Участник</th><th style="text-align:right;">Точки</th></tr></thead>
                <tbody id="general-body"></tbody>
            </table>
        </div>
        <div style="height: 400px; margin-top: 30px;"><canvas id="mainChart"></canvas></div>
    </div>

    <script>
        const URL_RESULTS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRNZBr2YwzfMeeokxS1ZNAQUdaHJ7kQfBEhfYI0P59vtnCMHgsz3R5f8T7kz62q_K9zwmIXdkzzfoAL/pub?gid=1231783594&single=true&output=csv";
        const URL_PREDS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRNZBr2YwzfMeeokxS1ZNAQUdaHJ7kQfBEhfYI0P59vtnCMHgsz3R5f8T7kz62q_K9zwmIXdkzzfoAL/pub?gid=1360122125&single=true&output=csv";

        const flagMapping = { "Австралия": "au", "Китай": "cn", "Япония": "jp", "Бахрейн": "bh", "Саудитска Арабия": "sa", "Маями": "us" };
        let rawResults = [], rawPreds = [], races = [];

        async function fetchData() {
            const [res1, res2] = await Promise.all([fetch(URL_RESULTS).then(r => r.text()), fetch(URL_PREDS).then(r => r.text())]);
            rawResults = parseCSV(res1);
            rawPreds = parseCSV(res2);
            const header = rawResults[0];
            for(let i=1; i < header.length; i+=2) { if(header[i]) races.push(header[i]); }
            initApp();
        }

        function parseCSV(t) { return t.split('\n').map(row => row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || row.split(',')); }

        function initApp() {
            const rSel = document.getElementById('select-race-results');
            const pSel = document.getElementById('pred-race-select');
            races.forEach(r => { rSel.add(new Option(r, r)); pSel.add(new Option(r, r)); });
            renderRaceResults();
            renderGeneral();
            renderPredictions();
        }

        function renderRaceResults() {
            const race = document.getElementById('select-race-results').value;
            const idx = races.indexOf(race) * 2 + 1;
            const body = document.getElementById('race-results-body');
            body.innerHTML = "";
            document.getElementById('res-flag').src = `https://flagcdn.com/w160/${flagMapping[race] || 'un'}.png`;
            document.getElementById('res-title').innerText = "ГП " + race;

            let res = [];
            for(let i=3; i < rawResults.length; i++) {
                let row = rawResults[i]; if(!row || !row[0]) continue;
                let p1 = parseInt(row[idx]) || 0, p2 = parseInt(row[idx+1]) || 0;
                res.push({ n: row[0], p1, p2, t: p1 + p2 });
            }
            res.sort((a,b) => b.t - a.t);
            document.getElementById('race-winner').innerText = res[0]?.n || "-";
            res.forEach(r => { body.innerHTML += `<tr><td>${r.n}</td><td>${r.p1}</td><td>${r.p2}</td><td style="text-align:right; font-weight:bold; color:var(--gold);">${r.t}</td></tr>`; });
        }

        function renderPredictions() {
            const selected = document.getElementById('pred-race-select').value;
            const content = document.getElementById('preds-content');
            content.innerHTML = "";
            const types = [{ l: "Предварителна прогноза", f: "Предварителна" }, { l: "Прогноза след квалификация", f: "След квалификация" }];

            types.forEach(type => {
                const filtered = rawPreds.filter(row => row[2]?.includes(selected) && row[3]?.includes(type.f));
                if(filtered.length > 0) {
                    let html = `<div class="section-title">${type.l}</div><div class="table-wrapper"><table><thead><tr><th>Участник</th>`;
                    for(let i=1; i<=10; i++) html += `<th>P${i}</th>`;
                    html += `</tr></thead><tbody>`;
                    let cards = `<div class="bonus-grid">`;
                    filtered.forEach(row => {
                        html += `<tr><td style="font-weight:bold; color:var(--accent);">${row[1]}</td>`;
                        for(let i=4; i<=22; i+=2) html += `<td>${(row[i]||"").split('(')[0]}</td>`;
                        html += `</tr>`;
                        cards += `<div class="bonus-card"><h4>${row[1]}</h4><b>DotD:</b> ${row[24]||'-'}<br><b>Fastest:</b> ${row[28]||'-'}<br><b>DNF:</b> ${row[26]||'-'}<br><b>Bold:</b> ${row[30]||'-'}</div>`;
                    });
                    content.innerHTML += html + `</tbody></table></div>` + cards + `</div>`;
                }
            });
        }

        function renderGeneral() {
            const body = document.getElementById('general-body'); body.innerHTML = "";
            let data = [];
            for(let i=3; i < rawResults.length; i++) {
                let row = rawResults[i]; if(!row || !row[0]) continue;
                let total = 0, hist = [];
                for(let j=1; j < row.length; j+=2) { total += (parseInt(row[j])||0) + (parseInt(row[j+1])||0); hist.push(total); }
                data.push({ n: row[0], t: total, h: hist });
            }
            data.sort((a,b) => b.t - a.t).forEach((p, i) => { body.innerHTML += `<tr><td>${i+1}</td><td>${p.n}</td><td style="text-align:right; font-weight:bold; color:var(--gold);">${p.t}</td></tr>`; });
        }

        function showTab(t) {
            ['race-results', 'predictions', 'general'].forEach(id => { document.getElementById(id + '-tab').classList.add('hidden'); document.getElementById('btn-' + id).classList.remove('active'); });
            document.getElementById(t + '-tab').classList.remove('hidden'); document.getElementById('btn-' + t).classList.add('active');
        }
        fetchData();
    </script>
</body>
</html>
